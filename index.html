<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moodboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #F9F5F0;
  overflow: hidden;
  font-family: sans-serif;
}

/* ── GRID ── */
.grid {
  position: fixed; inset: 0;
  display: grid;
  gap: 16px;
  padding: 16px;
  /* columns/rows set by JS */
}

/* ── CARD ── */
.card {
  position: relative;
  overflow: hidden;
  cursor: zoom-in;
  will-change: transform;
  transition: box-shadow .3s ease;
  /* transform set by JS each frame */
}

.card img {
  display: block;
  width: 100%; height: 100%;
  object-fit: cover;
  pointer-events: none;
  user-select: none;
  /* placeholder bg until loaded */
  background: #EDE8E2;
}

/* ── LIGHTBOX ── */
.lb {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(249,245,240,.93);
  backdrop-filter: blur(22px);
  align-items: center; justify-content: center; cursor: zoom-out;
}
.lb.on { display: flex; }
.lb-frame {
  max-width: 88vw; max-height: 88vh;
  animation: lbIn .34s cubic-bezier(.22,1,.36,1) both;
  cursor: default;
}
.lb-frame img {
  display: block; max-width: 88vw; max-height: 88vh;
  object-fit: contain;
  box-shadow: 0 20px 80px rgba(50,35,20,.18);
}
.lb-close {
  position: fixed; top: 1.6rem; right: 1.8rem;
  width: 36px; height: 36px; border-radius: 50%;
  border: .5px solid rgba(44,35,28,.15);
  background: #fff; color: #B3A89F;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; transition: all .22s; z-index: 501;
}
.lb-close:hover { background: #28231F; color: #fff; }

@keyframes lbIn {
  from { opacity:0; transform: scale(.92); }
  to   { opacity:1; transform: scale(1); }
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<div class="lb" id="lb" onclick="lbClose(event)">
  <div class="lb-close" onclick="lbClose(null,true)">✕</div>
  <div class="lb-frame"><img id="lb-img" src="" alt="" /></div>
</div>

function shuffle(arr) { return arr.slice().sort(function(){ return Math.random()-.5; }); }

/* ── Build grid ── */
var COLS = window.innerWidth < 700 ? 3 : (window.innerWidth < 1100 ? 5 : 7);
var ROWS = Math.ceil(68 / COLS); // enough to fill
var COUNT = COLS * ROWS;

var grid = document.getElementById('grid');
grid.style.gridTemplateColumns = 'repeat(' + COLS + ', 1fr)';
grid.style.gridTemplateRows    = 'repeat(' + ROWS + ', 1fr)';

var photos = shuffle(ALL_PHOTOS);
while (photos.length < COUNT) photos = photos.concat(shuffle(ALL_PHOTOS));
photos = photos.slice(0, COUNT);

var cards = [];

photos.forEach(function(file, i) {
  var card = document.createElement('div');
  card.className = 'card';

  var img = document.createElement('img');
  img.src = 'images/' + encodeURIComponent(file);
  img.loading = i < COLS * 3 ? 'eager' : 'lazy';
  img.onerror = function() { card.style.opacity = '0'; };

  card.appendChild(img);
  grid.appendChild(card);

  /* store state */
  cards.push({
    el:   card,
    file: file,
    /* current interpolated offsets */
    tx: 0, ty: 0,
    rx: 0, ry: 0,
    sc: 1,
    /* target values */
    ttx: 0, tty: 0,
    trx: 0, try_: 0,
    tsc: 1,
  });

  /* click → lightbox */
  card.addEventListener('click', function() {
    document.getElementById('lb-img').src = 'images/' + encodeURIComponent(file);
    document.getElementById('lb').classList.add('on');
    document.body.style.overflow = 'hidden';
  });
});

/* ── Mouse tracking ── */
var mx = -9999, my = -9999;
var REPEL_R  = 220;   /* radius of influence in px */
var REPEL_F  = 55;    /* max push distance px */
var TILT_DEG = 14;    /* max tilt degrees */
var SCALE_UP = 1.07;  /* hover scale */

window.addEventListener('mousemove', function(e) {
  mx = e.clientX; my = e.clientY;
});
window.addEventListener('mouseleave', function() {
  mx = -9999; my = -9999;
});

/* ── Animation loop ── */
var LERP = 0.10; /* smoothing — lower = more lag */

function lerp(a, b, t) { return a + (b - a) * t; }

function tick() {
  requestAnimationFrame(tick);

  cards.forEach(function(c) {
    var rect = c.el.getBoundingClientRect();
    var cx = rect.left + rect.width  / 2;
    var cy = rect.top  + rect.height / 2;

    var dx = cx - mx;
    var dy = cy - my;
    var dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < REPEL_R && dist > 0) {
      var strength = (1 - dist / REPEL_R);
      var push     = strength * REPEL_F;
      c.ttx  = (dx / dist) * push;
      c.tty  = (dy / dist) * push;
      /* tilt away from cursor */
      c.trx  = -(dy / dist) * TILT_DEG * strength;
      c.try_ =  (dx / dist) * TILT_DEG * strength;
      c.tsc  = 1 + 0.06 * strength;
    } else {
      c.ttx = 0; c.tty = 0;
      c.trx = 0; c.try_ = 0;
      c.tsc = 1;
    }

    /* smooth interpolation */
    c.tx = lerp(c.tx, c.ttx, LERP);
    c.ty = lerp(c.ty, c.tty, LERP);
    c.rx = lerp(c.rx, c.trx, LERP);
    c.ry = lerp(c.ry, c.try_, LERP);
    c.sc = lerp(c.sc, c.tsc, LERP);

    c.el.style.transform =
      'translate(' + c.tx.toFixed(2) + 'px,' + c.ty.toFixed(2) + 'px)' +
      ' perspective(600px)' +
      ' rotateX(' + c.rx.toFixed(2) + 'deg)' +
      ' rotateY(' + c.ry.toFixed(2) + 'deg)' +
      ' scale(' + c.sc.toFixed(4) + ')';

    /* subtle shadow boost when displaced */
    var s = Math.sqrt(c.tx*c.tx + c.ty*c.ty);
    c.el.style.boxShadow = s > 1
      ? '0 ' + (6 + s * 0.4).toFixed(0) + 'px ' + (20 + s).toFixed(0) + 'px rgba(50,35,20,' + (0.08 + s * 0.002).toFixed(3) + ')'
      : '';
  });
}
tick();

/* touch: simulate mouse at touch point */
window.addEventListener('touchmove', function(e) {
  mx = e.touches[0].clientX;
  my = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchend', function() { mx = -9999; my = -9999; });

/* ── Lightbox ── */
function lbClose(e, force) {
  if (force || (e && e.target.id === 'lb')) {
    document.getElementById('lb').classList.remove('on');
    document.body.style.overflow = '';
    setTimeout(function() { document.getElementById('lb-img').src = ''; }, 300);
  }
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') lbClose(null, true);
});
